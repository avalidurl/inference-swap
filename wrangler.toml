name = "inference-swap"
main = "src/index.js"
compatibility_date = "2026-06-14"
workers_dev = true
routes = [
  { pattern = "curb.numetal.xyz", custom_domain = true },
  { pattern = "api.curb.numetal.xyz", custom_domain = true },
  { pattern = "admin.curb.numetal.xyz", custom_domain = true },
]

[[kv_namespaces]]
binding = "SWAP"
id = "02f320cca3914f288f1430b653a85bdf"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
html_handling = "auto-trailing-slash"

[vars]
PRODUCT = "numetal-curb"
NETWORK = "eip155:8453"
USDC = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
# Hub fee recipient (Base) — AgentCash Base deposit; also the 5% recipient inside the split
HUB_PAY_TO = "0x3eee81B5b4cf1983b7DB36cf042B5d06c04F33eE"
DISCOVERY_PRICE_USD = "0.1"
FEE_BPS = "500"
MIN_FEE_USDC = "0.001"
# ── Single-payee (Option A) on-chain fee splitter ──────────────────────────
# Base split = 0xSplits PushSplit v2 (immutable). Buyer pays gross ONCE here; a keeper calls
# distribute() to fan out to seller + hub on-chain. Address is the deterministic predict for
# {seller 0x8f49:95%, hub 0x3eee:5%}, owner=0, salt=0 on PushSplitFactory V2.2
# (0x8E8eB0cC6AE34A38B67D5Cf91ACa38f60bc3Ecf4). Deploy via createSplitDeterministic before distribute.
SPLIT_ADDRESS_BASE = "0x546217c24617bCF9faD565E8ECABe5dE2D41326b"
# 0xSplits recipients (allocations = shares, total 1_000_000; distributionIncentive 0) — for keeper distribute() reconstruction + 402 display
SPLIT_RECIPIENTS_BASE = "0x8f49d4d782488e8576c8c54288027c57f4acf521:950000,0x3eee81B5b4cf1983b7DB36cf042B5d06c04F33eE:50000"
# Distinct demo seller (Bankr) so a real settle + distribute proves seller-side movement (≠ hub 0x3eee)
DEMO_SELLER_PAY_TO = "0x8f49d4d782488e8576c8c54288027c57f4acf521"
FACILITATOR = "https://api.cdp.coinbase.com/platform/v2/x402"
# Settlement mode: "demo" | "verify".
#   demo   → a present payment header settles but grants are marked verified:false
#            (no on-chain verification). Keeps the public pitch working without secrets.
#   verify → ONLY a CDP-facilitator-verified+settled payment mints a grant; a fake/bare
#            header is re-challenged with 402. Requires the CDP secrets below.
# Default when unset: verify if CDP creds present, else demo. Pinned to verify (CDP secrets wired).
SETTLE_MODE = "verify"
# Secrets (NOT in repo): ACCESS_KEY; CDP_API_KEY_ID + CDP_API_KEY_SECRET enable verify mode.
#   Set via: wrangler secret put CDP_API_KEY_ID / CDP_API_KEY_SECRET, then SETTLE_MODE=verify.
# Payments: settlement is single-payee x402 USDC on Base; fees split on-chain via a 0xSplits split
# Operator dashboard (admin.curb.numetal.xyz) — Cloudflare Access email gate.
#   ACCESS_TEAM_DOMAIN: the Zero Trust team domain that mints the Access JWT.
#   ACCESS_AUD: the AUD of the "CURB Admin" self-hosted Access application (admin.curb.numetal.xyz),
#     session 8h, policy "Founder only" (allow emails). /health is carved out public by the
#     "CURB Admin — health (public)" bypass app. Any non-matching AUD makes verifyAccessJwt return
#     ok:false → the JWT path fails closed (deny); Bearer ACCESS_KEY remains the tooling path.
ACCESS_TEAM_DOMAIN = "gokhanturhan.cloudflareaccess.com"
ACCESS_AUD = "a5b89dc50a9729a9ac431d9342b34569e42d5be5cee823f15abd8ff96cc1bc83"

# Backup book-fill if harness seller is down (primary seed = curb-harness seller cron)
[triggers]
crons = ["*/15 * * * *"]
