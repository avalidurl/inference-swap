name = "inference-swap"
main = "src/index.js"
compatibility_date = "2026-06-14"
workers_dev = true
routes = [
  { pattern = "curb.numetal.xyz", custom_domain = true },
  { pattern = "api.curb.numetal.xyz", custom_domain = true },
  { pattern = "admin.curb.numetal.xyz", custom_domain = true },
]

[[kv_namespaces]]
binding = "SWAP"
id = "02f320cca3914f288f1430b653a85bdf"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"
html_handling = "auto-trailing-slash"

[vars]
PRODUCT = "numetal-curb"
# ── Edge geo-block (Tier-0 sanctions/export-control gate; see src/geo.js) ──
# Comma list of ISO-3166-1 alpha-2 country codes blocked at the edge (451). Default =
# OFAC comprehensively-embargoed jurisdictions + China ("China totally" → HK + MO too).
# /health is always exempt. Occupied UA regions (Crimea/Donetsk/Luhansk) are handled in
# code when country=UA. Russia (RU) is intentionally NOT here (not comprehensively
# embargoed) — append "RU" to block it, no code change needed.
BLOCKED_COUNTRIES = "CN,HK,MO,CU,IR,KP,SY"
# ── OFAC SDN wallet screening (Tier-0 compliance; see src/ofac.js) ─────────
# Canonical source for sanctioned digital-currency addresses, refreshed into the SWAP
# KV (ofac:* keys) by the cron. Default = 0xB10C's maintained OFAC ETH/EVM mirror.
# Screening is fail-CLOSED on a positive match (451) and fail-OPEN on a cold cache
# (allow + warn). The Coinbase CDP facilitator also OFAC-screens at settle time.
OFAC_SOURCE_URL = "https://raw.githubusercontent.com/0xB10C/ofac-sanctioned-digital-currency-addresses/lists/sanctioned_addresses_ETH.txt"
NETWORK = "eip155:8453"
USDC = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
# Hub fee recipient (Base) — AgentCash Base deposit; also the 5% recipient inside the split
HUB_PAY_TO = "0x3eee81B5b4cf1983b7DB36cf042B5d06c04F33eE"
DISCOVERY_PRICE_USD = "0.1"
FEE_BPS = "500"
MIN_FEE_USDC = "0.001"
# ── Single-payee (Option A) on-chain fee splitter ──────────────────────────
# Base split = 0xSplits PushSplit v2 (immutable). Buyer pays gross ONCE here; a keeper calls
# distribute() to fan out to seller + hub on-chain. Address is the deterministic predict for
# {seller 0x8f49:95%, hub 0x3eee:5%}, owner=0, salt=0 on PushSplitFactory V2.2
# (0x8E8eB0cC6AE34A38B67D5Cf91ACa38f60bc3Ecf4). Deploy via createSplitDeterministic before distribute.
SPLIT_ADDRESS_BASE = "0x546217c24617bCF9faD565E8ECABe5dE2D41326b"
# 0xSplits recipients (allocations = shares, total 1_000_000; distributionIncentive 0) — for keeper distribute() reconstruction + 402 display
SPLIT_RECIPIENTS_BASE = "0x8f49d4d782488e8576c8c54288027c57f4acf521:950000,0x3eee81B5b4cf1983b7DB36cf042B5d06c04F33eE:50000"
# Distinct demo seller (Bankr) so a real settle + distribute proves seller-side movement (≠ hub 0x3eee)
DEMO_SELLER_PAY_TO = "0x8f49d4d782488e8576c8c54288027c57f4acf521"
# ── Distribute keeper (0xSplits distribute() submitter) ────────────────────
# Privy EVM server wallet that calls the split's distribute() to fan the gross out on-chain
# (seller 95% / hub 5%). distribute() is permissionless — the keeper only pays gas; the immutable
# split fixes where funds go, regardless of who signs. Signs via Privy REST (see src/distribute.js).
# PROVEN 2026-07-09: deploy 0x25f17c0a…aafc0163 · settle 0xdd2ad482…cd005768 (verified) ·
#   distribute 0x748a6470…a5d387e3.
#
# KEEPER = APP-OWNED Privy server wallet 0xf26838759BC3AC7394389Ae63a9Dcea0542Ab4bB
#   (wallet id s31q2qlsu4wubxo3kketsl8g, owner_id=null). Created 2026-07-10 and verified signable
#   with app auth alone (PRIVY_APP_ID:PRIVY_APP_SECRET → personal_sign 200) — NO owner/user signature
#   and NO privy-authorization-signature needed. This replaces the retired user/quorum-owned wallet
#   0xfcB6…4649 (id y1v7ph4oly0mlbf02qax1zfb), which was locked to a Google-login owner DID and could
#   never be app-signed. That old wallet still holds ~0.0011 ETH; it can only be swept via its owner's
#   Privy login and is otherwise abandoned.
#
# FOUNDER GO-LIVE — exactly TWO steps remain:
#   1. Fund the keeper with a little ETH on Base for gas (plain transfer to the address below), and
#         wrangler secret put PRIVY_APP_ID
#         wrangler secret put PRIVY_APP_SECRET
#   2. Flip KEEPER_DISTRIBUTE = "on" and deploy. The gated cron (src/distribute.js maybeAutoDistribute,
#      already wired from scheduled()) then submits distribute() whenever the split holds
#      ≥ KEEPER_DISTRIBUTE_MIN USDC, guarded by a SWAP-KV lock so runs never double-submit.
#   maybeAutoDistribute is a hard no-op while off / while signer secrets are absent / while unfunded.
KEEPER_ADDRESS = "0xf26838759BC3AC7394389Ae63a9Dcea0542Ab4bB"
PRIVY_KEEPER_WALLET_ID = "s31q2qlsu4wubxo3kketsl8g"
# "on" enables the gated cron auto-distribute. Requires PRIVY_APP_ID + PRIVY_APP_SECRET secrets and a
# funded, signable keeper (the app-owned server wallet above).
# LIVE 2026-07-10: keeper 0xf268… funded (0.0011 ETH Base) + secrets set → auto-distribute enabled.
KEEPER_DISTRIBUTE = "on"
# Minimum split USDC balance (raw 6dp) before the keeper spends gas on distribute(). 10000 = $0.01.
KEEPER_DISTRIBUTE_MIN = "10000"
# Base JSON-RPC endpoint for the keeper's balanceOf read. Optional — defaults to https://mainnet.base.org.
# BASE_RPC_URL = "https://mainnet.base.org"
FACILITATOR = "https://api.cdp.coinbase.com/platform/v2/x402"
# Settlement mode: "demo" | "verify".
#   demo   → a present payment header settles but grants are marked verified:false
#            (no on-chain verification). Keeps the public pitch working without secrets.
#   verify → ONLY a CDP-facilitator-verified+settled payment mints a grant; a fake/bare
#            header is re-challenged with 402. Requires the CDP secrets below.
# Default when unset: verify if CDP creds present, else demo. Pinned to verify (CDP secrets wired).
SETTLE_MODE = "verify"
# Secrets (NOT in repo): ACCESS_KEY; CDP_API_KEY_ID + CDP_API_KEY_SECRET enable verify mode.
#   Set via: wrangler secret put CDP_API_KEY_ID / CDP_API_KEY_SECRET, then SETTLE_MODE=verify.
# Payments: settlement is single-payee x402 USDC on Base; fees split on-chain via a 0xSplits split
# ── [mpp] Second payment rail — MPP (Machine Payments Protocol) on Tempo (DARK) ───────────────
# PUSH mode + SPLITS, additive to x402/Base. Same economics as x402 (seller 95% / hub 5%). The
# buyer broadcasts its OWN TIP-20 USDC transfers on Tempo (one tx: seller net + hub fee), then
# retries POST /v1/matches/{id}/pay with `Authorization: Payment <b64url>`; success → Payment-Receipt.
# Tempo is EVM (eip155:4217), so it REUSES the existing Base addresses on Tempo — NO new address
# fields: seller = the match's sellerPayTo, hub = HUB_PAY_TO (0x3eee… above).
#
# OFF by design: mppEnabled(env) requires MPP_ENABLED in {"1","true"} AND the MPP_SECRET_KEY secret.
# With MPP_ENABLED="0" and no secret, the rail is double-gated dark (challenge/verify/discovery all
# no-op). GO-LIVE = flip to "1" + `wrangler secret put MPP_SECRET_KEY` (HMAC key, NEVER committed).
MPP_ENABLED = "0"
# USDC on Tempo mainnet (TIP-20). Runtime override of the built-in default.
TEMPO_USDC = "0x20c000000000000000000000b9537d11c60e8b50"
TEMPO_CHAIN_ID = "4217"
TEMPO_RPC_URL = "https://rpc.tempo.xyz"
# Secret (NOT in repo): MPP_SECRET_KEY — HMAC key that binds/verifies the stateless MPP challenge ids.
#   Set via: wrangler secret put MPP_SECRET_KEY   (required, with MPP_ENABLED="1", to arm the rail)
# Operator dashboard (admin.curb.numetal.xyz) — Cloudflare Access email gate.
#   ACCESS_TEAM_DOMAIN: the Zero Trust team domain that mints the Access JWT.
#   ACCESS_AUD: the AUD of the "CURB Admin" self-hosted Access application (admin.curb.numetal.xyz),
#     session 8h, policy "Founder only" (allow emails). /health is carved out public by the
#     "CURB Admin — health (public)" bypass app. Any non-matching AUD makes verifyAccessJwt return
#     ok:false → the JWT path fails closed (deny); Bearer ACCESS_KEY remains the tooling path.
ACCESS_TEAM_DOMAIN = "gokhanturhan.cloudflareaccess.com"
ACCESS_AUD = "a5b89dc50a9729a9ac431d9342b34569e42d5be5cee823f15abd8ff96cc1bc83"

# Backup book-fill if harness seller is down (primary seed = curb-harness seller cron)
[triggers]
crons = ["*/15 * * * *"]
